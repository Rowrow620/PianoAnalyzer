<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title desc">
  <title id="title">Piano Analyzer architecture</title>
  <desc id="desc">A calibrated recording feeds independent video tracking and audio transcription. Fusion retains audio notes and flags missing visual support. Outputs are MIDI, annotated video, and optional evidence CSV.</desc>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#687587"/></marker>
  </defs>
  <rect width="960" height="480" rx="12" fill="#11151c"/>
  <g fill="none" stroke="#687587" stroke-width="2" marker-end="url(#arrow)">
    <path d="M480 108V132H260V156"/>
    <path d="M480 108V132H700V156"/>
    <path d="M260 234V260H480V284"/>
    <path d="M700 234V260H480V284"/>
    <path d="M480 362V386H180V408"/>
    <path d="M480 362V408"/>
    <path d="M480 362V386H780V408"/>
  </g>
  <g fill="#1b222c" stroke="#384352">
    <rect x="320" y="36" width="320" height="72" rx="8"/>
    <rect x="100" y="156" width="320" height="78" rx="8"/>
    <rect x="540" y="156" width="320" height="78" rx="8"/>
    <rect x="280" y="284" width="400" height="78" rx="8" fill="#1c2b36" stroke="#50788f"/>
    <rect x="60" y="408" width="240" height="44" rx="8"/>
    <rect x="360" y="408" width="240" height="44" rx="8"/>
    <rect x="660" y="408" width="240" height="44" rx="8"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <g font-size="20" font-weight="600" fill="#e1e7ed">
      <text x="480" y="65">Recording</text>
      <text x="260" y="188">Hand tracking</text>
      <text x="700" y="188">Audio transcription</text>
      <text x="480" y="316">Evidence fusion</text>
    </g>
    <g font-size="15" fill="#a7b2bf">
      <text x="480" y="89">C3-C7 calibration</text>
      <text x="260" y="213">OpenCV + MediaPipe</text>
      <text x="700" y="213">Transkun + PyTorch</text>
      <text x="480" y="341">Keep audio notes. Flag missing visual support.</text>
    </g>
    <g font-size="16" fill="#d2dae3">
      <text x="180" y="436">MIDI</text>
      <text x="480" y="436">Annotated video</text>
      <text x="780" y="436">Evidence CSV</text>
    </g>
  </g>
</svg>
