<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">Piano Analyzer architecture</title>
  <desc id="desc">Recorded video and calibration feed independent MediaPipe video tracking and Transkun audio transcription. Evidence fusion preserves audio notes and marks visual support before MIDI, annotated video, and optional CSV output.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#64748b"/></marker></defs>
  <rect width="1200" height="640" rx="16" fill="#f8fafc"/>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="600" y="45" font-size="24" font-weight="700" fill="#0f172a">Piano Analyzer</text>
    <rect x="390" y="70" width="420" height="64" rx="10" fill="#0f172a"/>
    <text x="600" y="97" font-size="18" font-weight="700" fill="white">Recorded video with piano audio</text>
    <text x="600" y="120" font-size="15" fill="#cbd5e1">Manual C3-C7 keyboard calibration</text>
    <g fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)">
      <path d="M600 134V158H290V185"/><path d="M600 134V158H910V185"/>
      <path d="M290 304V334H600V360"/><path d="M910 304V334H600V360"/>
      <path d="M600 450V480H230V515"/><path d="M600 450V515"/><path d="M600 450V480H970V515"/>
    </g>
    <rect x="80" y="185" width="420" height="119" rx="10" fill="white" stroke="#94a3b8"/>
    <rect x="700" y="185" width="420" height="119" rx="10" fill="white" stroke="#94a3b8"/>
    <text x="290" y="216" font-size="19" font-weight="700" fill="#0369a1">Video evidence</text>
    <text x="290" y="245" font-size="17" fill="#0f172a">OpenCV and MediaPipe</text>
    <text x="290" y="273" font-size="15" fill="#475569">Fingertips mapped to keyboard coordinates</text>
    <text x="910" y="216" font-size="19" font-weight="700" fill="#0369a1">Audio transcription</text>
    <text x="910" y="245" font-size="17" fill="#0f172a">Transkun and PyTorch</text>
    <text x="910" y="273" font-size="15" fill="#475569">Estimated pitch, onset, ending, and velocity</text>
    <text x="600" y="256" font-size="14" fill="#64748b">Independent</text>
    <text x="600" y="278" font-size="14" fill="#64748b">analysis</text>
    <rect x="320" y="360" width="560" height="90" rx="10" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="600" y="391" font-size="19" font-weight="700" fill="#0c4a6e">Evidence fusion</text>
    <text x="600" y="420" font-size="16" fill="#0f172a">Preserve audio notes; flag missing visual support</text>
    <g fill="white" stroke="#94a3b8">
      <rect x="80" y="515" width="300" height="65" rx="10"/>
      <rect x="450" y="515" width="300" height="65" rx="10"/>
      <rect x="820" y="515" width="300" height="65" rx="10"/>
    </g>
    <g font-size="17" font-weight="700" fill="#0f172a"><text x="230" y="553">MIDI performance</text><text x="600" y="553">Annotated video</text><text x="970" y="553">Evidence CSV</text></g>
    <text x="600" y="615" font-size="14" fill="#475569">Visual support describes evidence; physical key releases and strike strength are not measured.</text>
  </g>
</svg>
