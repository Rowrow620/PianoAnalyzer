[build-system]
requires = ["setuptools>=77,<81", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "piano-analyzer"
version = "0.1.0"
description = "Independent audio and visual evidence for piano transcription"
readme = "README.md"
authors = [{name = "Juan Sanchez"}]
license = "MIT"
requires-python = ">=3.10,<3.11"
dependencies = [
    "numpy==1.26.4", "opencv-contrib-python==4.11.0.86",
    "mediapipe==0.10.21", "pretty_midi==0.2.11.post0",
    "imageio-ffmpeg==0.6.0", "setuptools==79.0.1",
]

[tool.setuptools.packages.find]
where = ["src"]
