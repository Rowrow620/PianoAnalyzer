name: Unit tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-python-310:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip check
      - name: Check source compilation
        run: python -m compileall -q -x '[\\/]\.' .
      - name: Run unit tests
        run: python -B -m unittest discover -s tests -v
      - name: Check helper commands
        run: |
          python scripts/download_model.py --help
          python scripts/check_setup.py --core-only
