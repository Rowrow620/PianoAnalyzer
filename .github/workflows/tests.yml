name: Unit tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-python-310:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip check
      - name: Check source compilation
        run: python -m compileall -q -x '[\\/]\.' .
      - name: Run unit tests
        run: python -B -m unittest discover -s tests -v
      - name: Check helper commands
        run: |
          python scripts/download_model.py --help
          python scripts/check_setup.py --core-only
